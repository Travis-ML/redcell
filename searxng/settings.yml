# SearXNG settings for redcell's `web_search` builtin.
#
# `use_default_settings: true` merges this on top of the image's built-in
# defaults, so only the deviations live here. Do not vendor the full upstream
# settings.yml — it is ~68KB and every SearXNG upgrade turns it into a merge
# conflict.
#
# The secret key and the Valkey URL are supplied by SEARXNG_SECRET and
# SEARXNG_VALKEY_URL in docker-compose.yml; both override what this file says.
use_default_settings: true

general:
  instance_name: "redcell"
  debug: false

search:
  # The reason this file exists. JSON output is OFF by default in current
  # SearXNG, and redcell/searxng.py requests `format=json` — without this the
  # web_search tool gets an HTML error page and every search returns an error
  # string.
  formats:
    - json
  safe_search: 0
  autocomplete: ""

server:
  # This instance is reachable only from the compose network and localhost, and
  # its one client is the agent, which can legitimately issue bursts of searches
  # during a scan. The rate limiter would throttle exactly that.
  limiter: false
  public_instance: false

# Bing is off in SearXNG's defaults. It is enabled here as one more source for
# the general category: the default engines (Brave, DuckDuckGo, Google, Startpage)
# rate-limit or CAPTCHA a fresh instance quickly, and web_search then returns
# nothing. With use_default_settings, listing an engine here merges by name and
# leaves the rest of the defaults as they are.
engines:
  - name: bing
    disabled: false
