# The whole redcell stack. `docker compose up -d` starts everything the agent
# needs; the only external dependency is the model endpoint (AGENT_API_BASE).
#
#   qdrant             RAG vector store
#   valkey + searxng   the web_search builtin
#   sandbox-image      one-shot build of the execution-sandbox image
#   openshell-gateway  control plane for the execution sandbox
#   redcell            the agent server, which also spawns AgentGateway
#
# The execution sandbox itself is deliberately NOT a service here: the OpenShell
# gateway creates it as a sibling container on demand, and `redcell serve` asks
# for it at startup.
#
# Reaching the model: AGENT_API_BASE usually points at a LAN address (e.g.
# 192.168.0.193:8000), which containers reach over the default bridge — that is
# NOT host.docker.internal. Use host.docker.internal only if the model runs on
# this machine.

name: redcell

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: redcell-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST/HTTP API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships no curl or wget but does have bash, so use a bare TCP
      # connect rather than adding a package just for this.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  valkey:
    image: valkey/valkey:9-alpine
    container_name: redcell-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  searxng:
    image: searxng/searxng:2026.8.12-cdfdaa5a8
    container_name: redcell-searxng
    restart: unless-stopped
    # 8989 on the host keeps the URL that already worked; 8080 is what the image
    # serves on internally.
    ports:
      - "8989:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    environment:
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
      # Generate with `openssl rand -hex 32` and put it in .env. It has to be
      # stable — a random default would invalidate sessions on every restart.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env - openssl rand -hex 32}
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      # Checks what redcell actually calls, not just that the port is open: an
      # instance with JSON output disabled answers / fine but fails this.
      test:
        - CMD-SHELL
        - "wget -qO- 'http://127.0.0.1:8080/search?q=ping&format=json' >/dev/null || exit 1"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot: builds the execution-sandbox image (sandbox/Dockerfile) so a plain
  # `docker compose up` needs no separate `docker build`. The OpenShell gateway
  # creates sandbox containers from this tag; it is never pulled (gateway.toml
  # sets IfNotPresent). The container just exits; the image is the product.
  # Rebuild after editing sandbox/: `docker compose build sandbox-image`.
  sandbox-image:
    build:
      context: ./sandbox
    image: redcell-sandbox:local
    entrypoint: ["true"]
    restart: "no"

  # One-shot: the OpenShell gateway needs an Ed25519 sandbox-JWT keypair and
  # refuses to start without one, but will not generate it itself. This runs in a
  # container rather than on the host because /var/lib/openshell exists only
  # inside the Docker VM on Docker Desktop.
  openshell-jwt-init:
    image: alpine:3
    container_name: redcell-openshell-jwt-init
    user: "0"
    volumes:
      - type: bind
        source: /var/lib/openshell
        target: /var/lib/openshell
        bind:
          create_host_path: true
      - ./openshell/jwt-init.sh:/jwt-init.sh:ro
    command: ["sh", "-c", "apk add --no-cache openssl >/dev/null && sh /jwt-init.sh"]

  openshell-gateway:
    # Pinned to the same release as the openshell CLI in the redcell image
    # (Dockerfile). The two talk a versioned protocol, and gateway.toml was
    # worked out against this release; bump all three together.
    image: ghcr.io/nvidia/openshell/gateway:0.0.92
    container_name: redcell-openshell-gateway
    restart: unless-stopped
    # Clear the image's default CMD so gateway.toml owns every setting: CLI flags
    # beat the TOML file in the merge order.
    command: []
    # Docker-outside-of-Docker, not Docker-in-Docker — the gateway drives the
    # host's Docker socket to create sandboxes as sibling containers. Needs uid 0
    # to write the extracted supervisor binary and to reach the socket, but does
    # not need --privileged.
    user: "0"
    ports:
      # MUST be 8080 on both sides. The docker driver injects
      # host.openshell.internal:<gateway-port> into sandboxes as their callback
      # address, so a remapped host port leaves them stuck in Provisioning.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081" # health: /healthz, /readyz
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Source must equal target: the supervisor binary path recorded here is
      # resolved by the host Docker daemon when it creates sandbox containers, so
      # a named volume or a different path would not resolve.
      - type: bind
        source: /var/lib/openshell
        target: /var/lib/openshell
        bind:
          create_host_path: true
      - ./openshell/gateway.toml:/etc/openshell/gateway.toml:ro
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      # Blocked from the TOML file on purpose, to keep credential-bearing DSNs out
      # of version control. A plain SQLite path carries no credentials.
      OPENSHELL_DB_URL: "sqlite:/var/lib/openshell/gateway.db?mode=rwc"
      # OS-level path vars, outside the gateway config schema. They put the
      # extracted supervisor binary inside the bind mount so its path resolves for
      # the host daemon.
      XDG_DATA_HOME: /var/lib/openshell
      HOME: /var/lib/openshell
    depends_on:
      openshell-jwt-init:
        condition: service_completed_successfully
      sandbox-image:
        condition: service_completed_successfully

  redcell:
    build:
      context: .
      dockerfile: Dockerfile
    image: redcell:local
    container_name: redcell
    restart: unless-stopped
    ports:
      - "8800:8800"
    # .env supplies the model endpoint, keys, and security toggles. The
    # `environment:` block below wins over it, deliberately: .env holds
    # host-oriented values like 127.0.0.1 that point at the wrong place from
    # inside a container.
    env_file: .env
    environment:
      AGENT_SERVER_HOST: 0.0.0.0
      AGENT_SERVER_PORT: "8800"
      # Compose DNS names in place of the host-mode loopback defaults.
      AGENT_SEARXNG_URL: http://searxng:8080
      AGENT_QDRANT_HOST: qdrant
      AGENT_OPENSHELL_GATEWAY_URL: http://openshell-gateway:8080
      AGENT_OPENSHELL_HEALTH_URL: http://openshell-gateway:8081/healthz
      # Compose starts Qdrant and waits on its healthcheck, so redcell must not
      # try to run `docker compose` itself — it has no Docker socket, and should
      # not be given one.
      AGENT_QDRANT_MANAGE: "false"
      # AgentGateway still runs as a child process inside this container, so it
      # stays on loopback.
      AGENT_GATEWAY_URL: http://127.0.0.1:3030/mcp
    volumes:
      # PDFs ingested into the RAG store at startup.
      - ./documents:/app/documents
      # The ingestion manifest and the generated OpenShell SSH config. Persisting
      # it stops a restart from re-ingesting every document.
      - redcell_state:/app/.redcell
      # The Playwright MCP server writes traces to CWD.
      - playwright_traces:/app/.playwright-mcp
      # Shared with the collector, which tails the JSONL event sink. Mounted
      # unconditionally so enabling tracing later needs no compose change.
      - redcell_logs:/var/log/redcell
    depends_on:
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
      openshell-gateway:
        condition: service_started

  # --- observability profile ---------------------------------------------------
  # Not started by a plain `docker compose up`. Bring it up with:
  #     docker compose --profile observability up -d
  # and set AGENT_TRACING=true so redcell exports. Grafana Cloud instead of the
  # local stack: OTEL_CONFIG=./otel/collector-grafanacloud.yaml (see that file).

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: redcell-otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ${OTEL_CONFIG:-./otel/collector.yaml}:/etc/otel/config.yaml:ro
      # Read-only: the collector tails redcell's JSONL sink, it never writes it.
      - redcell_logs:/var/log/redcell:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
      GRAFANA_CLOUD_OTLP_AUTH: ${GRAFANA_CLOUD_OTLP_AUTH:-}

  tempo:
    image: grafana/tempo:latest
    container_name: redcell-tempo
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    # Tempo's own OTLP receiver port would collide with the collector's on the
    # host, so it is deliberately not published — only the collector talks to it,
    # over the compose network.
    volumes:
      - ./otel/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    user: "0"

  loki:
    image: grafana/loki:latest
    container_name: redcell-loki
    profiles: ["observability"]
    restart: unless-stopped
    # The image's built-in local config is fine for a dev log store, and it
    # already serves OTLP at /otlp.
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    user: "0"

  grafana:
    image: grafana/grafana:latest
    container_name: redcell-grafana
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      # 3001, not 3000: Open WebUI already owns 3000 on this machine.
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      # Local-only, single-operator dashboard; a login wall on a dev trace viewer
      # is friction with nothing behind it.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceToLogs
    depends_on:
      - tempo
      - loki

volumes:
  qdrant_storage:
  valkey_data:
  searxng_cache:
  redcell_state:
  playwright_traces:
  redcell_logs:
  tempo_data:
  loki_data:
  grafana_data:
