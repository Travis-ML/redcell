# AgentGateway config — launched by `uv run redcell serve`.
# Aggregates the MCP servers below behind one endpoint on :3030 (UI on :15000).
# You own this file: add policies / auth / observability here for the
# AI-security tools (Garak, Promptfoo, llm-guard) to exercise.
binds:
- port: 3030
  listeners:
  - routes:
    - policies:
        cors:
          allowOrigins:
          - "*"
          allowHeaders:
          - mcp-protocol-version
          - content-type
          - cache-control
          exposeHeaders:
          - "Mcp-Session-Id"
      backends:
      - mcp:
          targets:
          - name: playwright
            stdio:
              cmd: npx
              args: ["-y", "@playwright/mcp@latest"]
          # Filesystem ops — read/write/edit/list — CONFINED to the same OpenShell
          # sandbox over SSH, scoped to /sandbox there, so file operations share
          # the contained environment with `shell` below. The path is in the
          # sandbox; the policy makes everything outside it read-only.
          - name: filesystem
            stdio:
              cmd: ssh
              args: ["-F", ".redcell/openshell_ssh_config", "-T", "-o", "BatchMode=yes", "openshell-redcell-sbx.default", "mcp-server-filesystem", "/sandbox"]
          # `mcp<2` is required, not incidental: mcp 2.0 renamed McpError to
          # MCPError and mcp-server-fetch still imports the old name, so an
          # unpinned resolve crashes the server on import. AgentGateway surfaces
          # that as a 500 on the *aggregated* endpoint, which takes down every
          # other target too — one broken stdio server means zero tools overall.
          - name: fetch
            stdio:
              cmd: uvx
              args: ["--with", "mcp<2", "mcp-server-fetch"]
          # RAG over a self-hosted Qdrant vector DB via the official MCP server.
          # Local FastEmbed embeddings; auto-creates the collection. Exposes
          # qdrant-store (write/poison surface) + qdrant-find (retrieval =
          # indirect-injection vector). Env is set via the `env` wrapper so it
          # works regardless of gateway env support.
          - name: rag
            stdio:
              cmd: env
              args:
                - "QDRANT_URL=http://localhost:6333"
                - "COLLECTION_NAME=redcell-kb"
                - "EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2"
                - "uvx"
                - "mcp-server-qdrant"
          # Command execution — run_process — CONFINED to an OpenShell sandbox
          # over SSH: the server runs there, so commands can only ever execute
          # there, never on the gateway host. Containment is declared in
          # sandbox/policy.yaml (unprivileged user, /sandbox writable, no egress)
          # and enforced with Landlock + seccomp.
          #
          # `redcell serve` creates the sandbox and writes the ssh config below
          # (see redcell/openshell.py); no key material is involved, because the
          # OpenShell gateway authenticates the tunnel. SSH rather than
          # `openshell sandbox exec` because exec buffers stdin until EOF, so a
          # long-lived JSON-RPC session over it never gets a reply.
          - name: shell
            stdio:
              cmd: ssh
              args: ["-F", ".redcell/openshell_ssh_config", "-T", "-o", "BatchMode=yes", "openshell-redcell-sbx.default", "mcp-server-commands"]
