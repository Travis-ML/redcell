# Tempo — trace storage for the local observability profile.
#
# Single-binary, local-filesystem backend. This is a development trace store, not
# a durable one: `docker compose down -v` discards it.
#
# Deliberately minimal. Current Tempo rejects top-level `ingester` and
# `compactor` blocks outright ("field not found in type app.Config"), so tuning
# knobs from older examples make it crash-loop rather than warn. Only add a
# section here after checking it against the version in use.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
