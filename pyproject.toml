[project]
name = "redcell"
version = "0.1.0"
description = "A local-first security testing agent — an observable target for AI-security tooling."
authors = [{ name = "Streamline AI LLC (dba TravisML.ai)" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "mcp>=1.27.2",
    "pypdf>=4",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Optional so a plain `uv sync` stays lean and importing redcell never needs the
# OTel SDK. Enable with `uv sync --extra tracing` plus AGENT_TRACING=true; the
# Docker image installs it unconditionally, so in the compose stack tracing is
# one env flag.
tracing = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
]

[project.scripts]
redcell = "redcell.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redcell"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
